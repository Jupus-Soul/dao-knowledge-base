# Site settings for the Star Atlas DAO Codex.
# Editors never need to touch this file. See GUIDE.md.
site_name: Star Atlas DAO Codex
site_description: A repository of all information related to the Star Atlas DAO ecosystem.
# The public address of the site. When the site is published, GitHub fills
# this in automatically (SITE_URL); the address below is only the fallback.
site_url: !ENV [SITE_URL, "https://staratlasdaocouncil.com/"]
copyright: Star Atlas DAO

theme:
  name: material
  logo: assets/logo-council.png
  favicon: assets/logo.png
  font:
    text: Inter
  palette:
    # Dark is the default look (like the old GitBook site); visitors can switch.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.tooltips
    - toc.follow

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/theme-default.js
  - assets/contact-form.js

extra:
  generator: false  # hides the "Made with Material for MkDocs" line in the footer
  # Icons shown at the bottom of every page.
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/SADAOCouncil
      name: Star Atlas DAO Council on X
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@StarAtlasDAOCouncil
      name: Star Atlas DAO Council on YouTube

hooks:
  - hooks/site_design.py

plugins:
  - search
  - awesome-nav

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - sane_lists
  - pymdownx.escapeall:
      hardbreak: true
  - pymdownx.tilde
  - pymdownx.magiclink
  - toc:
      permalink: true

validation:
  links:
    # Lets pages use image paths like /assets/images/photo.png (what the
    # visual editor writes) and still work wherever the site is hosted.
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn
  nav:
    omitted_files: ignore
